# dbt looks for this file in the project folder first.
# Local runs use DuckDB; set the env vars below and add --target snowflake for Snowflake.
bellwether:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse/bellwether.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: BELLWETHER
      schema: ANALYTICS
      threads: 8
